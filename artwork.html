<!DOCTYPE html>
<html lang="en">

<head>
 <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JGR155JRKT"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-JGR155JRKT');
    </script>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artwork | Rakesh Jogawat</title>

    <meta
        name="description"
        content="Original artwork by Indian artist Rakesh Jogawat."
    >

    <meta
        id="og-title"
        property="og:title"
        content="Artwork | Rakesh Jogawat"
    >

    <meta
        id="og-description"
        property="og:description"
        content="Original artwork by Rakesh Jogawat."
    >

    <meta
        id="og-image"
        property="og:image"
        content=""
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">

        Rakesh Jogawat

        <span>Artist</span>

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="gallery.html">Gallery</a>

        <a href="index.html#about">About</a>

        <a href="index.html#contact">Contact</a>

    </nav>

</header>



<main class="artwork-page">


    <!-- =========================
         ARTWORK IMAGE
    ========================== -->

    <div class="artwork-image">

        <img
            id="artwork-main-image"
            src=""
            alt=""
        >

    </div>



    <!-- =========================
         ARTWORK DETAILS
    ========================== -->

    <div class="artwork-details">


        <!-- Navigation -->

        <div class="artwork-navigation">

            <a
                href="gallery.html"
                class="back-gallery"
            >
                ← BACK TO GALLERY
            </a>


            <a
                href="#"
                id="next-artwork"
                class="next-artwork"
            >
                NEXT →
            </a>

        </div>



        <p class="small-heading">
            ORIGINAL ARTWORK
        </p>


        <h1 id="artwork-title">
            Artwork
        </h1>


        <p
            id="artwork-medium"
            class="medium"
        >
        </p>


        <p
            id="artwork-description"
            class="description"
        >
        </p>



        <!-- Artwork information -->

        <div class="details">

            <p>
                <strong>Size:</strong>
                <span id="artwork-size"></span>
            </p>


            <p>
                <strong>Year:</strong>
                <span id="artwork-year"></span>
            </p>


            <p>
                <strong>Status:</strong>
                <span id="artwork-status"></span>
            </p>

        </div>



        <!-- Price / Enquiry -->

        <div class="buy-section">

            <p
                id="artwork-price"
                class="price"
            >
            </p>


            <a
                id="whatsapp-enquiry"
                href="#"
                target="_blank"
                class="whatsapp-button"
            >
                ENQUIRE ON WHATSAPP
            </a>

        </div>

    </div>

</main>



<!-- =========================
     LIGHTBOX
========================== -->

<div
    id="lightbox"
    class="lightbox"
>

    <button
        id="lightbox-close"
        class="lightbox-close"
        aria-label="Close image"
    >
        ×
    </button>


    <img
        id="lightbox-image"
        src=""
        alt=""
    >

</div>



<footer>

    <p>
        © 2026 Rakesh Jogawat Art
    </p>

</footer>



<!-- Artwork catalogue -->

<script src="artworks.js"></script>


<!-- Main JavaScript -->

<script src="script.js"></script>


</body>

</html>
