<body>


<header>

    <div class="logo">

        Rakesh Jogawat

        <span>Artist</span>

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="gallery.html">Gallery</a>

        <a href="index.html#about">About</a>

        <a href="index.html#contact">Contact</a>

    </nav>

</header>



<main class="gallery-page">


    <!-- =========================
         GALLERY HEADING
    ========================== -->

    <div class="gallery-heading">

        <p class="small-heading">
            THE COLLECTION
        </p>

        <h1>
            Gallery
        </h1>

        <p>
            Explore original paintings by Rakesh Jogawat.
        </p>

    </div>



    <!-- =========================
         GALLERY FILTERS
    ========================== -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>


        <button
            class="filter-btn"
            data-filter="watercolour"
        >
            Watercolour
        </button>


        <button
            class="filter-btn"
            data-filter="acrylic"
        >
            Acrylic
        </button>


        <button
            class="filter-btn"
            data-filter="oil"
        >
            Oil
        </button>


        <button
            class="filter-btn"
            data-filter="sold"
        >
            Sold
        </button>

    </div>



    <!-- =========================
         DYNAMIC GALLERY
    ========================== -->

    <div
        class="gallery-grid"
        id="gallery-grid"
    >

        <!--
            Paintings are automatically
            inserted here by script.js
        -->

    </div>


</main>



<footer>

    <p>
        © 2026 Rakesh Jogawat Art
    </p>

</footer>
